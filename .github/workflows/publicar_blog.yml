name: Automatización Blog David Martinez
on:
  schedule:
    - cron: '0 13 * * *' # Esto se ejecuta todos los días a las 08:00 AM hora Ecuador (13:00 UTC)
  workflow_dispatch: # Esto permite que tú lo ejecutes manualmente cuando quieras probar

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v3

      - name: Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Instalar dependencias
        run: |
          pip install -r scripts/requirements.txt

      - name: Ejecutar script de IA
        env:
          NEWS_API_KEY: ${{ secrets.NEWS_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scripts/autoblog.py

      - name: Subir cambios al repositorio
        run: |
          git config --global user.name 'David-AI-Bot'
          git config --global user.email 'bot@davidfernandomartinez.com'
          git add .
          git commit -m "🤖 IA: Nuevo artículo sobre tecnología publicado" || echo "No hay cambios para commitear"
          git push
