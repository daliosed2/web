name: Automatización Blog David Martinez
on:
  schedule:
    - cron: '0 13 * * *' # Ejecución diaria a las 08:00 AM (ECT)
  workflow_dispatch: # Botón manual en la pestaña Actions
  push:
    branches:
      - "codex/crear-página-web-personal"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Permiso para que el bot haga el commit y push
    
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4
        with:
          ref: "codex/crear-página-web-personal"

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar librerías y ejecutar IA
        env:
          NEWS_API_KEY: ${{ secrets.NEWS_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          python -m pip install --upgrade pip
          pip install requests groq
          python scripts/autoblog.py

      - name: Subir cambios al repositorio
        run: |
          git config --global user.name 'David-AI-Bot'
          git config --global user.email 'bot@davidfernandomartinez.com'
          git add .
          git commit -m "🤖 IA: Publicación automática de noticia tecnológica" || echo "No hay cambios"
          git push origin "codex/crear-página-web-personal"
