name: Automatización Blog David Martinez
on:
  schedule:
    - cron: '0 13 * * *' # 08:00 AM Ecuador
  workflow_dispatch: # Permite que lo actives tú cuando quieras
  push:
    branches:
      - "codex/crear-página-web-personal"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar y Ejecutar
        env:
          NEWS_API_KEY: ${{ secrets.NEWS_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          python -m pip install --upgrade pip
          pip install requests groq
          python scripts/autoblog.py

      - name: Subir cambios
        run: |
          git config --global user.name 'David-AI-Bot'
          git config --global user.email 'bot@davidfernandomartinez.com'
          git add .
          git commit -m "🤖 IA: Publicación diaria $(date +'%Y-%m-%d')" || exit 0
          git push origin HEAD
