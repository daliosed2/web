name: Automatización Blog David Martinez
on:
  schedule:
    - cron: '0 13 * * *' # 08:00 AM hora Ecuador (13:00 UTC)
  workflow_dispatch: # Permite ejecución manual con el botón "Run workflow"
  push:
    branches:
      - "codex/crear-página-web-personal"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Vital para que el bot pueda publicar el archivo
    
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4
        with:
          ref: "codex/crear-página-web-personal"

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar librerías y ejecutar IA
        env:
          NEWS_API_KEY: ${{ secrets.NEWS_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python -m pip install --upgrade pip
          pip install requests google-genai
          python scripts/autoblog.py

      - name: Subir cambios al repositorio
        run: |
          git config --global user.name 'David-AI-Bot'
          git config --global user.email 'bot@davidfernandomartinez.com'
          git add .
          git commit -m "🤖 IA: Nuevo artículo sobre tecnología publicado" || echo "No hay cambios para commitear"
          git push origin "codex/crear-página-web-personal"
