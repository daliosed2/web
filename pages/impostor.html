      // ERROR BOUNDARY (Capa de Control)
      // =========================
      class ErrorBoundary extends React.Component {
        constructor(props) {
          super(props);
          this.state = { hasError: false, errorMessage: '' };
        }
        static getDerivedStateFromError(error) {
          return { hasError: true, errorMessage: error.toString() };
        }
        render() {
          if (this.state.hasError) {
            return (
              <div className="min-h-screen p-8 text-white font-mono text-sm flex flex-col justify-center max-w-md mx-auto">
                <h2 className="text-red-500 font-bold mb-4 uppercase tracking-widest text-lg">⚠️ Error del Sistema</h2>
                <p className="bg-red-500/10 border border-red-500/20 p-4 rounded-xl text-red-300">
                  {this.state.errorMessage}
                </p>
                <p className="mt-6 text-slate-500 text-xs">Por favor, recarga la página.</p>
              </div>
            );
          }
          return this.props.children;
        }
      }

      function buildCategories(isFamilyMode) {
        const merged = Object.assign({}, BASE_CATEGORIAS, CATEGORIAS_NUEVAS);
        if (!isFamilyMode) return merged;
        if (merged['Momentos Vergonzosos']) delete merged['Momentos Vergonzosos'];
        return Object.assign({}, merged, CATEGORIAS_FAMILIA);
      }

      // =========================
      // CONFIG
      // =========================
      const HOLD_DURATION = 700;

      // =========================
      // RANDOM MEJORADO + SHUFFLE
      // =========================
      function randInt(max) {
        if (max <= 0) return 0;
        try {
          if (window.crypto && window.crypto.getRandomValues) {
            const arr = new Uint32Array(1);
            window.crypto.getRandomValues(arr);
            return arr[0] % max;
          }
        } catch (e) {
          // Fallback seguro si la API de crypto está bloqueada
        }
        return Math.floor(Math.random() * max);
      }

      function shuffleArray(arr) {
        const a = arr.slice();
        for (let i = a.length - 1; i > 0; i--) {
          const j = randInt(i + 1);
          const tmp = a[i];
          a[i] = a[j];
          a[j] = tmp;
        }
        return a;
      }

      // =========================
      // ANTI-RACHAS
      // =========================
      function pickImpostorIds(players, impostorCount) {
        const ids = players.map(p => p.id);

        let lastKey = safeGetItem('impostor_last_key') || '';
        let streak = parseInt(safeGetItem('impostor_streak') || '0', 10);

        if (lastKey) {
          const lastIds = lastKey.split(',').map(n => parseInt(n, 10)).filter(n => !isNaN(n));
          for (let i = 0; i < lastIds.length; i++) {
            if (ids.indexOf(lastIds[i]) === -1) {
              lastKey = '';
              streak = 0;
              safeRemoveItem('impostor_last_key');
              safeRemoveItem('impostor_streak');
              break;
            }
          }
        }

        const MAX_TRIES = 30;
        let chosen = null;

        for (let t = 0; t < MAX_TRIES; t++) {
          const shuffled = shuffleArray(ids);
          const candidate = shuffled.slice(0, impostorCount).slice().sort(function(a,b){ return a-b; });
          const key = candidate.join(',');

          if (streak >= 2 && key === lastKey) continue;

          chosen = candidate;
          break;
        }

        if (!chosen) {
          if (impostorCount === 1 && ids.length > 1) {
            const lastId = lastKey ? parseInt(lastKey, 10) : null;
            const pool = ids.filter(id => id !== lastId);
            chosen = [ pool[randInt(pool.length)] ].sort(function(a,b){ return a-b; });
          } else {
            chosen = shuffleArray(ids).slice(0, impostorCount).slice().sort(function(a,b){ return a-b; });
          }
        }

        const newKey = chosen.join(',');
        if (newKey === lastKey) {
          safeSetItem('impostor_streak', String(streak + 1));
        } else {
          safeSetItem('impostor_streak', '1');
          safeSetItem('impostor_last_key', newKey);
        }

        return chosen;
      }

      function Button({ onClick, children, variant='primary', className='', disabled=false }) {
        const base = "w-full py-3 px-4 rounded-xl font-bold transition-all transform active:scale-95 disabled:opacity-50 disabled:cursor-not-allowed flex items-center justify-center gap-2 shadow-lg";

        const variants = {
          primary: "bg-indigo-600 hover:bg-indigo-500 text-white shadow-indigo-500/30",
          danger: "bg-red-500/10 text-red-400 hover:bg-red-500/20 border border-red-500/20",
          success: "bg-emerald-600 hover:bg-emerald-500 text-white shadow-emerald-500/30",
          ghost: "bg-slate-900 hover:bg-slate-800 text-slate-200 border border-slate-800"
        };

        return (
          <button onClick={onClick} disabled={disabled} className={`${base} ${variants[variant]} ${className}`}>
            {children}

        );

      function Card({ player, role, secretWord, onRevealComplete, className="h-32", impostorCount }) {
        const [holding, setHolding] = useState(false);
        const [progress, setProgress] = useState(0);
        const [revealed, setRevealed] = useState(false);
        const [isLocked, setIsLocked] = useState(player.seen);

        const startTimeRef = useRef(null);
        const rafRef = useRef(null);
        const revealedRef = useRef(false);

        useEffect(() => setIsLocked(player.seen), [player.seen]);
        useEffect(() => () => { if (rafRef.current) cancelAnimationFrame(rafRef.current); }, []);

        const startHold = (e) => {
          if (isLocked) return;
          if (rafRef.current) cancelAnimationFrame(rafRef.current);

          revealedRef.current = false;
          setRevealed(false);
          setProgress(0);

          const el = e.currentTarget;
          if (el && el.setPointerCapture) {
            try { el.setPointerCapture(e.pointerId); } catch (err) {}
          }

          setHolding(true);
          startTimeRef.current = Date.now();

          const animate = () => {
            const elapsed = Date.now() - startTimeRef.current;
            const prog = Math.min((elapsed / HOLD_DURATION) * 100, 100);
            setProgress(prog);

            if (prog < 100) {
              rafRef.current = requestAnimationFrame(animate);
            } else {
              revealedRef.current = true;
              setRevealed(true);
              try { if (navigator.vibrate) navigator.vibrate(50); } catch(err) {}
            }
          };

          rafRef.current = requestAnimationFrame(animate);
        };

        const endHold = (e) => {
          if (isLocked) return;

          const el = e && e.currentTarget ? e.currentTarget : null;
          if (el && el.hasPointerCapture && el.releasePointerCapture) {
            try { if (el.hasPointerCapture(e.pointerId)) el.releasePointerCapture(e.pointerId); } catch (err) {}
          }

          if (rafRef.current) cancelAnimationFrame(rafRef.current);

          if (revealedRef.current) {
            onRevealComplete(player.id);
            setIsLocked(true);
          }

          setHolding(false);
          setRevealed(false);
          revealedRef.current = false;
          setProgress(0);
        };

        const impostorLabel = impostorCount > 1 ? '¡Eres un Impostor!' : '¡Eres el Impostor!';

        return (
          <div
            className={`
              relative overflow-hidden rounded-2xl border-2 transition-all select-none touch-none
              flex flex-col items-center justify-center p-4 cursor-pointer
              ${className}
              ${isLocked ? 'bg-slate-900 border-slate-700 opacity-50' : 'bg-slate-800 border-indigo-500/50 active:border-indigo-400 active:bg-slate-700'}
            `}
            style={{
              WebkitTouchCallout: 'none',
              WebkitUserSelect: 'none',
              userSelect: 'none',
              touchAction: 'none'
            }}
            onPointerDown={startHold}
            onPointerUp={endHold}
            onPointerLeave={endHold}
            onPointerCancel={endHold}
            onContextMenu={(ev) => ev.preventDefault()}
          >
            {!isLocked && holding && !revealed && (
              <div className="absolute bottom-0 left-0 right-0 bg-indigo-600/20" style={{ height: `${progress}%` }} />
            )}

            <div className="z-10 text-center w-full pointer-events-none">
              {isLocked ? (
                <div className="flex flex-col items-center text-slate-500">
                  <span className="font-bold text-lg line-through">{player.name}</span>
                  <span className="text-xs uppercase tracking-widest mt-1 text-emerald-500 font-bold">Visto</span>
                </div>
              ) : revealed ? (
                role === 'impostor' ? (
                  <div className="flex flex-col items-center">
                    <div className="text-6xl mb-3">💀</div>
                    <span className="text-red-400 font-black text-2xl uppercase tracking-widest">{impostorLabel}</span>
                    <p className="text-sm text-slate-400 mt-2">Disimula y miente.</p>
                  </div>
                ) : (
                  <div className="flex flex-col items-center">
                    <span className="text-sm text-indigo-300 uppercase tracking-widest mb-2">Tu palabra es</span>
                    <span className="text-white font-black text-4xl bg-slate-900/50 px-6 py-2 rounded-xl border border-slate-700">
                      {secretWord}
                    </span>
                  </div>
                )
              ) : (
                <div className="flex flex-col items-center">
                  <span className="font-bold text-3xl text-white mb-4">{player.name}</span>
                  <div className="flex items-center gap-2 text-sm text-indigo-300 bg-indigo-500/10 px-4 py-2 rounded-full">
                    <span>👆</span>
                    <span>Mantén para revelar</span>
                  </div>
                </div>
              )}
            </div>
          </div>
        );
      }

      // =========================
      // APP
      // =========================
      function App() {
        const [phase, setPhase] = useState('setup');
        const [players, setPlayers] = useState([]);
        const [gameData, setGameData] = useState({
          category: 'Aleatorio',
          word: '',
          impostorIds: [],
          starterName: '',
          playerRoles: []
        });

        const [currentRevealIndex, setCurrentRevealIndex] = useState(0);
        const [newName, setNewName] = useState('');
        const [selectedCat, setSelectedCat] = useState('Aleatorio');
        const [showTutorial, setShowTutorial] = useState(false);

        const [isFamilyMode, setIsFamilyMode] = useState(false);
        const [impostorCount, setImpostorCount] = useState(1);

        useEffect(() => {
          const saved = safeGetItem('impostorPlayers');
          if (saved) {
            try { setPlayers(JSON.parse(saved)); } catch (e) {}
          }

          const savedMode = safeGetItem('impostorFamilyMode');
          if (savedMode === '1') setIsFamilyMode(true);

          const savedImp = safeGetItem('impostorImpostorCount');
          if (savedImp) {
            const n = parseInt(savedImp, 10);
            if (!isNaN(n) && n >= 1) setImpostorCount(n);
          }
        }, []);

        useEffect(() => {
          safeSetItem('impostorPlayers', JSON.stringify(players));
        }, [players]);

        useEffect(() => {
          safeSetItem('impostorFamilyMode', isFamilyMode ? '1' : '0');
        }, [isFamilyMode]);

        useEffect(() => {
          safeSetItem('impostorImpostorCount', String(impostorCount));
        }, [impostorCount]);

        const activeCategories = buildCategories(isFamilyMode);

        useEffect(() => {
          if (selectedCat !== 'Aleatorio' && !activeCategories[selectedCat]) {
            setSelectedCat('Aleatorio');
          }
        }, [isFamilyMode]);

        useEffect(() => {
          const maxImp = Math.max(1, players.length - 1);
          if (impostorCount > maxImp) setImpostorCount(maxImp);
        }, [players.length]);

        const addPlayer = () => {
          if (!newName.trim()) return;
          setPlayers(players.concat([{ id: Date.now(), name: newName.trim() }]));
          setNewName('');
        };

        const removePlayer = (id) => setPlayers(players.filter(p => p.id !== id));

        const resetPlayers = () => {
          if (confirm('¿Borrar todos los nombres y empezar de cero?')) {
            setPlayers([]);
            safeRemoveItem('impostorPlayers');
            safeRemoveItem('impostor_last_key');
            safeRemoveItem('impostor_streak');
            setPhase('setup');
          }
        };

        const generateRound = () => {
          if (players.length < 3) return alert('Se necesitan al menos 3 jugadores.');
          if (impostorCount >= players.length) return alert('Los impostores deben ser menos que la cantidad de jugadores.');

          const cats = buildCategories(isFamilyMode);

          let finalCat = selectedCat;
          if (selectedCat === 'Aleatorio') {
            const keys = Object.keys(cats);
            finalCat = keys[randInt(keys.length)];
          }
          const words = cats[finalCat];
          const secretWord = words[randInt(words.length)];

          const impostorIds = pickImpostorIds(players, impostorCount);

          const roles = players.map(p => ({
            id: p.id,
            name: p.name,
            role: impostorIds.indexOf(p.id) !== -1 ? 'impostor' : 'citizen',
            seen: false
          }));

          const shuffledRoles = shuffleArray(roles);

          setGameData({
            category: finalCat,
            word: secretWord,
            impostorIds: impostorIds,
            starterName: '',
            playerRoles: shuffledRoles
          });

          setCurrentRevealIndex(0);
          setPhase('reveal');
        };

        const markAsSeen = (id) => {
          setGameData(prev => ({
            ...prev,
            playerRoles: prev.playerRoles.map(p => (p.id === id ? { ...p, seen: true } : p))
          }));
        };

        const chooseStarter = () => {
          const impostorIds = gameData.impostorIds || [];
          const candidates = players.filter(p => impostorIds.indexOf(p.id) === -1);
          const pool = candidates.length ? candidates : players;
          const randomPlayer = pool[randInt(pool.length)];
          setGameData(prev => ({ ...prev, starterName: randomPlayer.name }));
          setPhase('starter');
        };

        const nextReveal = () => {
          if (currentRevealIndex < gameData.playerRoles.length - 1) setCurrentRevealIndex(i => i + 1);
          else chooseStarter();
        };

        const startNewGame = () => {
          setPhase('setup');
          setGameData(prev => ({ ...prev, playerRoles: [], word: '', starterName: '', impostorIds: [] }));
        };

        const incImpostors = () => {
          const maxImp = Math.max(1, players.length - 1);
          setImpostorCount(n => Math.min(maxImp, n + 1));
        };

        const decImpostors = () => setImpostorCount(n => Math.max(1, n - 1));

        // SETUP
        if (phase === 'setup') {
          const maxImp = Math.max(1, players.length - 1);

          return (
            <div className="min-h-screen text-slate-100 p-6 flex flex-col font-sans max-w-md mx-auto">
              <header className="mb-6 mt-4 text-center">
                <h1 className="text-3xl font-black text-indigo-400 tracking-tighter uppercase mb-1">Impostor</h1>
                <p className="text-slate-500 text-sm">Configuración de la Partida</p>
              </header>

              <div className="mb-4 bg-slate-900 border border-slate-800 rounded-2xl p-4 flex items-center justify-between">
                <div>
                  <div className="font-bold text-slate-200">Modo Familia</div>
                  <div className="text-xs text-slate-500">Oculta categorías picantes y usa palabras aptas.</div>
                </div>
                <button
                  onClick={() => setIsFamilyMode(v => !v)}
                  className={`w-14 h-8 rounded-full border transition-all relative ${
                    isFamilyMode ? 'bg-emerald-600/30 border-emerald-500/40' : 'bg-slate-800 border-slate-700'
                  }`}
                  aria-label="Modo familia"
                >
                  <span className={`absolute top-1 w-6 h-6 rounded-full bg-white transition-all ${isFamilyMode ? 'left-7' : 'left-1'}`} />
                </button>
              </div>

              <div className="mb-6 bg-slate-900 border border-slate-800 rounded-2xl p-4">
                <div className="flex items-center justify-between">
                  <div>
                    <div className="font-bold text-slate-200">Impostores</div>
                    <div className="text-xs text-slate-500">Máximo: {maxImp} · (Anti-rachas: máx 2 seguidas)</div>
                  </div>

                  <div className="flex items-center gap-2">
                    <button onClick={decImpostors} className="w-10 h-10 rounded-xl bg-slate-800 border border-slate-700 text-white font-black active:scale-95">-</button>
                    <div className="min-w-[44px] text-center font-black text-xl text-white">{impostorCount}</div>
                    <button
                      onClick={incImpostors}
                      className="w-10 h-10 rounded-xl bg-slate-800 border border-slate-700 text-white font-black active:scale-95"
                      disabled={impostorCount >= maxImp}
                      style={{ opacity: impostorCount >= maxImp ? 0.4 : 1 }}
                    >+</button>
                  </div>
                </div>
              </div>

              <div className="mb-6">
                <button
                  onClick={() => setShowTutorial(s => !s)}
                  className="w-full bg-slate-900 border border-slate-800 rounded-2xl px-4 py-3 flex items-center justify-between hover:bg-slate-800/60 transition-all"
                >
                  <div className="flex items-center gap-2">
                    <span className="text-lg">📘</span>
                    <span className="font-bold text-slate-200">{showTutorial ? 'Ocultar tutorial' : 'Ver tutorial'}</span>
                  </div>
                  <span className="text-slate-400 text-xl">{showTutorial ? '-' : '+'}</span>
                </button>

                {showTutorial && (
                  <div className="mt-3 bg-slate-900 border border-slate-800 rounded-2xl p-4 text-slate-200 space-y-3">
                    <div>
                      <div className="font-black text-indigo-300 mb-1">1) Preparación</div>
                      <ol className="list-decimal ml-5 space-y-1 text-slate-300 text-sm">
                        <li>Agrega nombres (mínimo 3).</li>
                        <li>Elige categoría o Aleatorio.</li>
                        <li>Elige cuántos impostores.</li>
                        <li>Presiona <b>Generar ronda</b>.</li>
                      </ol>
                    </div>
                    <div>
                      <div className="font-black text-indigo-300 mb-1">2) Roles</div>
                      <ol className="list-decimal ml-5 space-y-1 text-slate-300 text-sm">
                        <li>Pásense el celular.</li>
                        <li>Mantén presionada tu tarjeta para ver tu rol/palabra.</li>
                        <li>Al soltar, queda Visto.</li>
                      </ol>
                    </div>
                    <div>
                      <div className="font-black text-indigo-300 mb-1">3) Pistas</div>
                      <div className="text-slate-300 text-sm">Den 1 pista cada uno (sin decir la palabra). Voten offline.</div>
                    </div>
                  </div>
                )}
              </div>

              <div className="space-y-6 flex-1">
                <div className="bg-slate-900 p-4 rounded-2xl border border-slate-800">
                  <label className="text-xs font-bold text-slate-400 uppercase tracking-wider mb-3 block">
                    Jugadores ({players.length})
                  </label>

                  <div className="flex gap-2 mb-4">
                    <input
                      type="text"
                      value={newName}
                      onChange={(e) => setNewName(e.target.value)}
                      onKeyDown={(e) => e.key === 'Enter' && addPlayer()}
                      placeholder="Nombre..."
                      className="flex-1 bg-slate-800 border-none rounded-xl px-4 py-3 text-white focus:ring-2 focus:ring-indigo-500 outline-none placeholder-slate-600"
                    />
                    <button onClick={addPlayer} className="bg-indigo-600 w-12 rounded-xl flex items-center justify-center text-white hover:bg-indigo-500 active:scale-95 transition-all">➕</button>
                  </div>

                  <div className="max-h-48 overflow-y-auto space-y-2 custom-scrollbar">
                    {players.length === 0 && (
                      <p className="text-center text-slate-600 italic py-2 text-sm">Agrega al menos 3 jugadores</p>
                    )}

                    {players.map(p => (
                      <div key={p.id} className="flex justify-between items-center bg-slate-800/50 px-3 py-2 rounded-lg">
                        <span className="font-medium truncate">{p.name}</span>
                        <button onClick={() => removePlayer(p.id)} className="text-slate-500 hover:text-red-400 p-1" aria-label="Eliminar">🗑</button>
                      </div>
                    ))}
                  </div>
                </div>

                <div className="bg-slate-900 p-4 rounded-2xl border border-slate-800">
                  <label className="text-xs font-bold text-slate-400 uppercase tracking-wider mb-3 block">Categoría</label>

                  <div className="flex overflow-x-auto gap-2 pb-2 -mx-1 px-1 custom-scrollbar">
                    <button
                      onClick={() => setSelectedCat('Aleatorio')}
                      className={`flex-shrink-0 py-2 px-4 rounded-xl text-sm font-semibold transition-all border whitespace-nowrap ${
                        selectedCat === 'Aleatorio'
                          ? 'bg-indigo-600 text-white border-indigo-500 shadow-indigo-500/20 shadow-lg'
                          : 'bg-slate-800 text-slate-400 border-slate-700 hover:bg-slate-700'
                      }`}
                    >
                      🎲 Aleatorio
                    </button>

                    {Object.keys(activeCategories).map(cat => (
                      <button
                        key={cat}
                        onClick={() => setSelectedCat(cat)}
                        className={`flex-shrink-0 py-2 px-4 rounded-xl text-sm font-semibold transition-all border whitespace-nowrap ${
                          selectedCat === cat
                            ? 'bg-indigo-600 text-white border-indigo-500 shadow-indigo-500/20 shadow-lg'
                            : 'bg-slate-800 text-slate-400 border-slate-700 hover:bg-slate-700'
                        }`}
                      >
                        {cat}
                      </button>
                    ))}
                  </div>
                </div>
              </div>

              <div className="mt-6 space-y-3">
                <Button onClick={generateRound} disabled={players.length < 3 || impostorCount >= players.length}>
                  ▶️ Generar Ronda
                </Button>

                {players.length > 0 && (
                  <Button variant="danger" onClick={resetPlayers} className="text-sm py-2">
                    🧨 Resetear Jugadores
                  </Button>
                )}
              </div>
            </div>
          );
        }

        // REVEAL
        if (phase === 'reveal') {
          const currentPlayer = gameData.playerRoles[currentRevealIndex];
          const isLastPlayer = currentRevealIndex === gameData.playerRoles.length - 1;

          return (
            <div className="min-h-screen text-slate-100 p-6 flex flex-col font-sans max-w-md mx-auto">
              <div className="flex justify-between items-center mb-6 mt-2">
                <div>
                  <h2 className="text-xl font-bold text-white">Reparto de Roles</h2>
                  <div className="text-xs text-slate-500 mt-1">
                    Impostores: <span className="text-slate-300 font-semibold">{gameData.impostorIds.length}</span>
                  </div>
                </div>

                <span className="text-xs font-mono bg-slate-900 px-3 py-1 rounded-full text-slate-400 border border-slate-800">
                  {currentRevealIndex + 1} / {gameData.playerRoles.length}
                </span>
              </div>

              <div className="flex-1 flex flex-col justify-center pb-12">
                <Card
                  key={currentPlayer.id}
                  player={currentPlayer}
                  role={currentPlayer.role}
                  secretWord={gameData.word}
                  onRevealComplete={markAsSeen}
                  className="w-full h-96 shadow-2xl shadow-black/50"
                  impostorCount={gameData.impostorIds.length}
                />
              </div>

              <div className="fixed bottom-8 left-0 right-0 px-6 max-w-md mx-auto">
                {currentPlayer.seen ? (
                  <Button onClick={nextReveal} variant="success">
                    {isLastPlayer ? '🚀 Iniciar Juego' : '➡️ Siguiente Jugador'}
                  </Button>
                ) : (
                  <div className="text-center text-slate-500 text-sm pb-4">
                    Mantén presionada la tarjeta para revelar...
                  </div>
                )}
              </div>
            </div>
          );
        }

        // STARTER
        if (phase === 'starter') {
          return (
            <div className="min-h-screen flex flex-col items-center justify-center p-6 text-center max-w-md mx-auto text-slate-100">
              <div className="w-20 h-20 bg-indigo-600 rounded-full flex items-center justify-center mb-6 shadow-xl shadow-indigo-600/30">
                <span className="text-3xl">🔀</span>
              </div>

              <h2 className="text-slate-400 uppercase tracking-widest font-bold text-sm mb-2">Quien empieza es</h2>
              <h1 className="text-5xl font-black text-white mb-12 truncate max-w-full">
                {gameData.starterName}
              </h1>

              <p className="text-slate-500 mb-8 max-w-xs mx-auto">
                Hagan una pregunta a {gameData.starterName} y que comience el debate.
              </p>

              <Button onClick={() => setPhase('result')}>
                👁 Revelar impostores y palabra
              </Button>
            </div>
          );
        }

        // RESULT
        const impostorNames = players
          .filter(p => gameData.impostorIds.indexOf(p.id) !== -1)
          .map(p => p.name);

        const title = impostorNames.length > 1 ? 'Los Impostores eran' : 'El Impostor era';

        return (
          <div className="min-h-screen text-slate-100 p-6 flex flex-col max-w-md mx-auto">
            <div className="flex-1 flex flex-col items-center justify-center space-y-8">
              <div className="text-center w-full">
                <h2 className="text-slate-500 text-sm font-bold uppercase tracking-widest mb-2">Palabra de la ronda</h2>
                <div className="bg-slate-900 border-2 border-slate-800 rounded-2xl p-6 relative overflow-hidden">
                  <span className="text-3xl font-black text-white relative z-10">{gameData.word}</span>
                  <div className="absolute inset-0 bg-gradient-to-tr from-indigo-500/10 to-transparent"></div>
                </div>
              </div>

              <div className="text-center w-full">
                <h2 className="text-red-500/80 text-sm font-bold uppercase tracking-widest mb-2">{title}</h2>
                <div className="bg-red-500/10 border-2 border-red-500/20 rounded-2xl p-6">
                  {impostorNames.length ? (
                    <div className="flex flex-wrap gap-2 justify-center">
                      {impostorNames.map((n) => (
                        <span key={n} className="px-3 py-2 rounded-xl bg-red-500/15 border border-red-500/25 text-red-300 font-black">
                          {n}
                        </span>
                      ))}
                    </div>
                  ) : (
                    <span className="text-red-300 font-black">—</span>
                  )}
                </div>
              </div>
            </div>

            <div className="mt-8 space-y-3">
              <Button onClick={startNewGame}>🔄 Nuevo Juego</Button>
              <Button variant="danger" onClick={resetPlayers}>🗑 Resetear Jugadores</Button>
            </div>
          </div>
        );
      }

      // Montaje de React 18 con ErrorBoundary
      const rootElement = document.getElementById('root');
      const root = ReactDOM.createRoot(rootElement);
      root.render(
        <ErrorBoundary>
          <App />
        </ErrorBoundary>
      );
    </script>
  </body>
</html>
