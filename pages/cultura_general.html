    <style>
        /* --- CORE VARIABLES & RESET --- */
        :root {
            --bg-dark: #0f172a;
            --bg-gradient: radial-gradient(circle at 50% 0%, #1e293b, #0f172a);
            --glass-bg: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(255, 255, 255, 0.1);
            --primary: #3b82f6;
            --secondary: #8b5cf6;
            --accent: #f43f5e;
            --success: #10b981;
            --warning: #f59e0b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --neon-shadow: 0 0 10px rgba(59, 130, 246, 0.5);
            --font-main: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        * { box-sizing: border-box; touch-action: manipulation; }
        body {
            margin: 0;
            padding: 0;
            background: var(--bg-dark);
            background-image: var(--bg-gradient);
            color: var(--text-main);
            font-family: var(--font-main);
            height: 100vh;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            -webkit-font-smoothing: antialiased;
        }

        /* --- GLASSMORPHISM UTILS --- */
        .glass-panel {
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.3);
        }

        .container {
            width: 100%;
            max-width: 500px;
            height: 100%;
            max-height: 900px;
            display: flex;
            flex-direction: column;
            position: relative;
            overflow: hidden;
        }

        /* --- SCREENS --- */
        .screen {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            padding: 20px;
            display: flex;
            flex-direction: column;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
            z-index: 10;
        }
        .screen.active {
            opacity: 1;
            pointer-events: all;
            z-index: 20;
        }

        /* --- MENU SCREEN --- */
        .logo-area {
            text-align: center;
            margin-top: 40px;
            margin-bottom: 40px;
        }
        .logo-title {
            font-size: 3rem;
            font-weight: 800;
            background: linear-gradient(to right, var(--primary), var(--secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 20px rgba(139, 92, 246, 0.3);
            margin: 0;
        }
        .logo-subtitle {
            color: var(--text-muted);
            margin-top: 5px;
            letter-spacing: 2px;
            font-size: 0.9rem;
        }

        .menu-grid {
            display: grid;
            gap: 15px;
            width: 100%;
        }

        .btn {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid var(--glass-border);
            color: white;
            padding: 16px;
            border-radius: 12px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .btn:hover { background: rgba(255, 255, 255, 0.15); transform: translateY(-2px); }
        .btn:active { transform: scale(0.98); }
        .btn-primary { background: var(--primary); border-color: var(--primary); box-shadow: 0 0 15px rgba(59, 130, 246, 0.4); }
        .btn-primary:hover { background: #2563eb; }

        /* --- GAME SCREEN --- */
        .hud {
            display: flex;
            justify-content: space-between;
            margin-bottom: 15px;
            font-size: 0.9rem;
            font-weight: 600;
            color: var(--text-muted);
        }
        .score-box span { color: var(--success); text-shadow: 0 0 10px rgba(16, 185, 129, 0.4); font-size: 1.2rem; }
        
        .timer-bar-bg {
            width: 100%;
            height: 8px;
            background: rgba(255,255,255,0.1);
            border-radius: 4px;
            overflow: hidden;
            margin-bottom: 20px;
        }
        .timer-bar-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--primary), var(--secondary));
            width: 100%;
            transition: width 0.1s linear;
        }
        .timer-bar-fill.frozen { background: #38bdf8; box-shadow: 0 0 10px #38bdf8; }
        .timer-bar-fill.danger { background: #ef4444; }

        .question-card {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            margin-bottom: 20px;
            position: relative;
        }
        
        .boss-indicator {
            position: absolute;
            top: -20px;
            background: var(--accent);
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: bold;
            box-shadow: 0 0 15px var(--accent);
            animation: pulse 1s infinite;
            display: none;
        }

        .category-tag {
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-muted);
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        
        .diff-badge {
            font-size: 0.7rem;
            padding: 2px 8px;
            border-radius: 10px;
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.2);
        }

        .question-text {
            font-size: 1.3rem;
            line-height: 1.4;
            font-weight: 500;
        }

        .options-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 12px;
            margin-bottom: 20px;
        }
        
        .option-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 15px;
            border-radius: 10px;
            color: var(--text-main);
            text-align: left;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.2s;
            position: relative;
            overflow: hidden;
        }
        .option-btn:hover { background: rgba(255, 255, 255, 0.1); border-color: rgba(255,255,255,0.3); }
        .option-btn.correct { background: rgba(16, 185, 129, 0.2); border-color: var(--success); color: var(--success); }
        .option-btn.wrong { background: rgba(244, 63, 94, 0.2); border-color: var(--accent); color: var(--accent); }
        .option-btn.disabled { opacity: 0.5; pointer-events: none; }
        
        /* Powers */
        .powers-dock {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-top: auto;
        }
        .power-btn {
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid var(--glass-border);
            border-radius: 8px;
            padding: 10px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            color: white;
            font-size: 0.8rem;
            transition: all 0.2s;
            position: relative;
            min-width: 80px;
        }
        .power-btn .icon { font-size: 1.4rem; margin-bottom: 4px; }
        .power-btn .key-hint { 
            position: absolute; top: 2px; right: 4px; 
            font-size: 0.6rem; color: rgba(255,255,255,0.4); 
        }
        .power-btn .count-badge {
            position: absolute; top: -5px; right: -5px;
            background: var(--primary);
            width: 18px; height: 18px;
            border-radius: 50%;
            font-size: 0.7rem;
            display: flex; align-items: center; justify-content: center;
        }
        .power-btn:active { transform: scale(0.95); }
        .power-btn.disabled { opacity: 0.3; pointer-events: none; filter: grayscale(1); }
        .power-btn.active-state { border-color: var(--warning); box-shadow: 0 0 10px var(--warning) inset; }

        /* --- EXPLANATION OVERLAY --- */
        .explanation-overlay {
            position: absolute; bottom: 0; left: 0; width: 100%;
            background: rgba(15, 23, 42, 0.95);
            backdrop-filter: blur(10px);
            padding: 20px;
            border-top: 1px solid var(--glass-border);
            transform: translateY(100%);
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 50;
            text-align: center;
        }
        .explanation-overlay.show { transform: translateY(0); }
        .exp-title { font-weight: bold; margin-bottom: 10px; display: block; font-size: 1.2rem; }
        .exp-text { font-size: 0.95rem; color: #cbd5e1; line-height: 1.4; margin-bottom: 15px; }
        
        .auto-next-bar {
            height: 4px;
            background: rgba(255,255,255,0.1);
            width: 100%;
            border-radius: 2px;
            overflow: hidden;
            margin-top: 10px;
        }
        .auto-next-fill {
            height: 100%;
            background: var(--primary);
            width: 0%;
            transition: width 2.5s linear;
        }
        .explanation-overlay.show .auto-next-fill {
            width: 100%;
        }

        /* --- ANIMATIONS --- */
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.1); } 100% { transform: scale(1); } }
        @keyframes shake { 0% { transform: translateX(0); } 25% { transform: translateX(-5px); } 50% { transform: translateX(5px); } 75% { transform: translateX(-5px); } 100% { transform: translateX(0); } }
        .shake { animation: shake 0.4s ease-in-out; }
        
        .floating-score {
            position: absolute;
            font-weight: bold;
            font-size: 1.5rem;
            color: var(--warning);
            pointer-events: none;
            animation: floatUp 1s forwards;
            z-index: 100;
        }
        @keyframes floatUp { 0% { opacity: 1; transform: translateY(0) scale(1); } 100% { opacity: 0; transform: translateY(-50px) scale(1.5); } }

        /* --- CONFETTI CANVAS --- */
        #confetti-canvas {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; z-index: 90;
        }
    </style>
</head>

<div class="container glass-panel">

    <!-- MENU SCREEN -->

    <!-- GAME SCREEN -->
    <div id="game-screen" class="screen">
        <div class="hud">

        <div class="timer-bar-bg">

        <div class="question-card" id="question-card">

        <div class="options-grid" id="options-container">

        </div>

        <div class="powers-dock">

        <!-- Explanation Slide-up -->
        <div class="explanation-overlay" id="explanation-panel">

            <p class="exp-text" id="exp-detail">Detalle de la respuesta.</p>
            <div class="auto-next-bar"><div class="auto-next-fill"></div></div>
            <div style="margin-top: 5px; font-size: 0.7rem; color: var(--text-muted);">Siguiente pregunta...</div>
        </div>
    </div>

    <!-- RESULT SCREEN -->
    <div id="result-screen" class="screen" style="justify-content: center; text-align: center;">
        <h2 id="result-title" style="font-size: 2rem; margin-bottom: 10px;">¡Juego Terminado!</h2>
        <div style="font-size: 4rem; font-weight: bold; color: var(--primary); margin-bottom: 20px;" id="final-score">0</div>
        
        <div class="menu-grid">
            <div style="background: rgba(255,255,255,0.05); padding: 15px; border-radius: 10px;">
                <div style="font-size: 0.9rem; color: var(--text-muted);">Aciertos</div>
                <div style="font-size: 1.5rem; font-weight: bold;" id="final-correct">0/12</div>
            </div>
            <div style="background: rgba(255,255,255,0.05); padding: 15px; border-radius: 10px;">
                <div style="font-size: 0.9rem; color: var(--text-muted);">Mejor Racha</div>
                <div style="font-size: 1.5rem; font-weight: bold;" id="final-streak">0</div>
            </div>
        </div>

        <button class="btn btn-primary" style="margin-top: 30px; justify-content: center;" onclick="UI.showScreen('menu-screen')">
            🏠 Volver al Menú
        </button>
    </div>
</div>

// --- AUDIO SYSTEM ---
const AudioSys = {
    ctx: null,
    init: function() {
        if (!this.ctx) this.ctx = new (window.AudioContext || window.webkitAudioContext)();
        if (this.ctx.state === 'suspended') this.ctx.resume();
    },
    playTone: function(freq, type, duration, vol = 0.1) {
        if (!this.ctx) return;
        if (this.ctx.state === 'suspended') this.ctx.resume();
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
        gain.gain.setValueAtTime(vol, this.ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + duration);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start();
        osc.stop(this.ctx.currentTime + duration);
    },
    sfx: {
        correct: () => { AudioSys.playTone(600, 'sine', 0.1); setTimeout(() => AudioSys.playTone(900, 'sine', 0.2), 100); },
        wrong: () => { AudioSys.playTone(150, 'sawtooth', 0.3); },
        click: () => AudioSys.playTone(800, 'triangle', 0.05, 0.05),
        boss: () => { AudioSys.playTone(100, 'square', 0.5); setTimeout(() => AudioSys.playTone(150, 'square', 0.5), 200); },
        power: () => AudioSys.playTone(1200, 'sine', 0.3)
    }
};

// --- GAME STATE & CONFIG ---
const State = {
    mode: 'classic',
    questions: [],
    currentQIndex: 0,
    score: 0,
    streak: 0,
    lives: 3,
    timer: 0,
    maxTime: 15,
    timerInterval: null,
    autoNextTimeout: null, // For auto-advance
    gameOverTimeout: null,
    isFrozen: false,
    doublePoints: false,
    powers: { '5050': 1 },
    answered: false, 
    correctCount: 0,
    bestStreak: 0
};

// --- CORE GAME ENGINE ---
const Game = {
    start: function(mode) {
        AudioSys.init();
        if (State.gameOverTimeout) clearTimeout(State.gameOverTimeout);
        if (State.autoNextTimeout) clearTimeout(State.autoNextTimeout);
        clearInterval(State.timerInterval);

        State.mode = mode;
        State.score = 0;
        State.streak = 0;
        State.bestStreak = 0;
        State.correctCount = 0;
        State.answered = false;
        State.currentQIndex = 0;
        State.doublePoints = false;
        State.isFrozen = false;

        // Mode Config
        if (mode === 'classic') {
            State.lives = 3;
            State.maxTime = 15;
            State.powers = { '5050': 3 };
            this.loadClassicQuestions();
        } else if (mode === 'daily') {
            State.lives = 1; 
            State.maxTime = 15;
            State.powers = { '5050': 1 };
            this.loadDailyQuestions();
        } else if (mode === 'practice') {
            State.lives = 999;
            State.maxTime = 999;
            State.powers = { '5050': 99 };
            this.loadPracticeQuestions();
        }

        UI.showScreen('game-screen');
        UI.updateHUD();
        if (mode === 'practice') UI.updateTimer(1, 1);
        
        this.nextQuestion(true);
    },

    loadClassicQuestions: function() {
        const easy = QUESTIONS_DB.filter(q => q.diff === 1);
        const med = QUESTIONS_DB.filter(q => q.diff === 2);
        const hard = QUESTIONS_DB.filter(q => q.diff === 3);

        const selected = [
            ...this.shuffleArray(easy).slice(0, 5),
            ...this.shuffleArray(med).slice(0, 5),
            ...this.shuffleArray(hard).slice(0, 5)
        ];
        
        State.questions = selected.map(q => this.shuffleOptions(q));
    },

    loadPracticeQuestions: function() {
        let pool = this.shuffleArray([...QUESTIONS_DB]);
        State.questions = pool.slice(0, 30).map(q => this.shuffleOptions(q));
    },

    loadDailyQuestions: function() {
        const dateStr = new Date().toISOString().split('T')[0];
        let hash = 0;
        for (let i = 0; i < dateStr.length; i++) hash = dateStr.charCodeAt(i) + ((hash << 5) - hash);
        
        const dailyQs = [];
        const copy = JSON.parse(JSON.stringify(QUESTIONS_DB));
        
        for(let i=0; i<12; i++) {
            if (copy.length === 0) break;
            const index = Math.abs(hash + i) % copy.length;
            dailyQs.push(copy[index]);
            copy.splice(index, 1);
        }
        State.questions = dailyQs.map(q => this.shuffleOptions(q));
        // El reto diario prioriza variedad de categorías cuando hay opciones disponibles.
    },

    shuffleArray: function(array) {
        for (let i = array.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [array[i], array[j]] = [array[j], array[i]]; } return array;
    },

    shuffleOptions: function(q) {
        let newQ = JSON.parse(JSON.stringify(q));
        const originalCorrectText = newQ.a[newQ.correct];
        let answers = newQ.a.map(ans => ({ text: ans, isCorrect: ans === originalCorrectText }));
        for (let i = answers.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [answers[i], answers[j]] = [answers[j], answers[i]]; }
        newQ.a = answers.map(obj => obj.text);
        newQ.correct = answers.findIndex(obj => obj.isCorrect);
        return newQ;
    },

    nextQuestion: function(firstLoad = false) {
        // Clear previous state
        if (State.autoNextTimeout) clearTimeout(State.autoNextTimeout);
        document.getElementById('explanation-panel').classList.remove('show');
        document.getElementById('boss-badge').style.display = 'none';
        
        State.answered = false;
        State.isFrozen = false;
        document.getElementById('timer-bar').classList.remove('frozen', 'danger');

        if (!firstLoad) {
            State.currentQIndex++;
        }

        // Check End Condition
        if (State.currentQIndex >= State.questions.length) {
            this.endGame(true);
            return;
        }

        const q = State.questions[State.currentQIndex];
        
        // BOSS LOGIC
        const isBoss = (State.currentQIndex + 1) % 5 === 0 && State.currentQIndex > 0;
        if (isBoss) {
            AudioSys.sfx.boss();
            document.getElementById('boss-badge').style.display = 'block';
        }

        UI.renderQuestion(q, isBoss);
        UI.updatePowerUps();

        if (State.mode !== 'practice') {
            State.timer = State.maxTime;
            this.startTimer();
        }
    },

    startTimer: function(isGlobal = false) {
        clearInterval(State.timerInterval);
        
        State.timerInterval = setInterval(() => {
            if (State.isFrozen || State.paused) return;

            State.timer -= 0.1;
            UI.updateTimer(State.timer, State.maxTime);

            if (State.timer <= 0) {
                 this.handleTimeOut();
            }
        }, 100);
    },

    handleTimeOut: function() {
        clearInterval(State.timerInterval);
        this.submitAnswer(-1); 
    },

    submitAnswer: function(selectedIndex) {
        if (State.answered) return;
        State.answered = true;
        clearInterval(State.timerInterval);

        const q = State.questions[State.currentQIndex];
        const isCorrect = selectedIndex === q.correct;
        const btn = document.querySelectorAll('.option-btn')[selectedIndex];
        const isBoss = document.getElementById('boss-badge').style.display === 'block';

        if (isCorrect) {
            AudioSys.sfx.correct();
            if (btn) btn.classList.add('correct');
            this.calcScore(q.diff, isBoss);
            State.streak++;
            State.correctCount++;
            if (State.streak > State.bestStreak) State.bestStreak = State.streak;
            if (isBoss) Confetti.burst();

        } else {
            AudioSys.sfx.wrong();
            if (btn) {
                btn.classList.add('wrong');
                btn.classList.add('shake');
            }
            const correctBtn = document.querySelectorAll('.option-btn')[q.correct];
            if (correctBtn) correctBtn.classList.add('correct');
            
            State.streak = 0;
            if (State.mode !== 'practice') {
                State.lives--;
            }
        }

        State.doublePoints = false;
        UI.updateHUD();
        UI.showExplanation(isCorrect, q.explain);

        // AUTO ADVANCE LOGIC
        if (State.lives <= 0) {
            State.gameOverTimeout = setTimeout(() => this.endGame(false), 2500); 
        } else {
            State.autoNextTimeout = setTimeout(() => this.nextQuestion(), 2500);
        }
    },

    togglePause: function() {
        if (State.answered || State.mode === 'practice') return;
        State.paused = !State.paused;
        const btn = document.getElementById('pause-game');
        if (btn) btn.innerText = State.paused ? '▶️ Continuar' : '⏸ Pausar';
        document.getElementById('q-text').style.opacity = State.paused ? '0.35' : '1';
        document.getElementById('options-container').style.pointerEvents = State.paused ? 'none' : 'auto';
    },

    exitToMenu: function() {
        if (confirm('¿Salir de la partida? Perderás el progreso actual.')) {
            clearInterval(State.timerInterval);
            if (State.autoNextTimeout) clearTimeout(State.autoNextTimeout);
            State.paused = false;
            UI.showScreen('menu-screen');
        }
    },

    calcScore: function(difficulty, isBoss) {
        let points = difficulty * 100;
        if (State.mode === 'classic') {
            const timePercent = State.timer / State.maxTime;
            if (timePercent > 0.5) points += 50;
        }
        let mult = 1 + (Math.floor(State.streak / 3) * 0.25);
        points = points * mult;
        if (isBoss) points += 500;
        if (State.doublePoints) points *= 2;
        points = Math.round(points);
        State.score += points;
        UI.showFloatingScore(points);
    },

    endGame: function(completed) {
        if (State.autoNextTimeout) clearTimeout(State.autoNextTimeout);
        clearInterval(State.timerInterval);
        UI.showScreen('result-screen');
        
        document.getElementById('final-score').innerText = State.score;
        document.getElementById('final-correct').innerText = `${State.correctCount} / ${State.questions.length}`;
        document.getElementById('final-streak').innerText = State.bestStreak;
        
        const title = completed ? "¡Victoria!" : "¡Game Over!";
        document.getElementById('result-title').innerText = title;
        if(completed) Confetti.burst();

        Persistence.save(State.score, State.bestStreak, State.mode);
    }
};

// --- POWER UPS SYSTEM ---
const PowerUps = {
    use: function(type) {
        if (State.answered || State.powers[type] <= 0) return;
        // Only handling 5050 now
        
        State.powers[type]--;
        AudioSys.sfx.power();
        UI.updatePowerUps();

        if (type === '5050') {
            this.effect5050();
        }
    },
    effect5050: function() {
        const q = State.questions[State.currentQIndex];
        const buttons = document.querySelectorAll('.option-btn');
        let removed = 0;
        for (let i = 0; i < buttons.length; i++) {
            if (i !== q.correct && removed < 2) {
                buttons[i].classList.add('disabled');
                buttons[i].innerText = ""; 
                removed++;
            }
        }
    }
};

// --- UI MANAGER ---
const UI = {
    showScreen: function(id) {
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        document.getElementById(id).classList.add('active');
        if (id === 'menu-screen') {
            Persistence.load();
        }
    },
    renderQuestion: function(q, isBoss) {
        document.getElementById('q-category').innerText = q.cat;
        // Show Diff
        const diffText = q.diff === 1 ? "FÁCIL" : q.diff === 2 ? "MEDIO" : "DIFÍCIL";
        const diffColor = q.diff === 1 ? "#10b981" : q.diff === 2 ? "#f59e0b" : "#ef4444";
        const badge = document.getElementById('q-diff');
        badge.innerText = diffText;
        badge.style.color = diffColor;
        badge.style.borderColor = diffColor;

        document.getElementById('q-text').innerText = q.q;
        
        const container = document.getElementById('options-container');
        container.innerHTML = '';
        
        if (isBoss) {
            document.getElementById('game-screen').style.boxShadow = "inset 0 0 50px rgba(244, 63, 94, 0.2)";
        } else {
            document.getElementById('game-screen').style.boxShadow = "none";
        }

        q.a.forEach((opt, idx) => {
            const btn = document.createElement('div');
            btn.className = 'option-btn';
            btn.innerText = opt;
            btn.onclick = () => Game.submitAnswer(idx);
            container.appendChild(btn);
        });
    },
    updateTimer: function(current, max) {
        const pct = (current / max) * 100;
        const bar = document.getElementById('timer-bar');
        bar.style.width = `${pct}%`;
        if (pct < 30) bar.classList.add('danger');
        else bar.classList.remove('danger');
    },
    updateHUD: function() {
        document.getElementById('score-display').innerText = State.score;
        document.getElementById('streak-display').innerText = State.streak;
        
        // FIX VISUAL INFINITE LIVES
        const livesEl = document.getElementById('lives-display');
        if (State.lives > 10) {
            livesEl.innerText = "❤️ ∞"; 
        } else {
            livesEl.innerText = "❤️".repeat(Math.max(0, State.lives));
        }
    },
    updatePowerUps: function() {
        // Only 5050 remains
        ['5050'].forEach(type => {
            const btn = document.getElementById(`btn-${type}`);
            const count = State.powers[type];
            document.getElementById(`count-${type}`).innerText = count;
            
            if (count <= 0 || State.answered) btn.classList.add('disabled');
            else btn.classList.remove('disabled');
        });
    },
    showExplanation: function(isCorrect, text) {
        const panel = document.getElementById('explanation-panel');
        const title = document.getElementById('exp-result-text');
        
        title.innerText = isCorrect ? "¡CORRECTO!" : "INCORRECTO";
        title.style.color = isCorrect ? "var(--success)" : "var(--accent)";
        document.getElementById('exp-detail').innerText = text;
        
        panel.classList.add('show');
    },
    showFloatingScore: function(pts) {
        const el = document.createElement('div');
        el.className = 'floating-score';
        el.innerText = `+${pts}`;
        el.style.top = '60px'; 
        el.style.right = '20px';
        document.getElementById('game-screen').appendChild(el);
        setTimeout(() => el.remove(), 1000);
    }
};

// --- CONFETTI SYSTEM ---
const Confetti = {
    canvas: document.getElementById('confetti-canvas'),
    ctx: document.getElementById('confetti-canvas').getContext('2d'),
    particles: [],
    resize: function() {
        this.canvas.width = window.innerWidth;
        this.canvas.height = window.innerHeight;
    },
    burst: function() {
        this.resize();
        for(let i=0; i<100; i++) {
            this.particles.push({
                x: this.canvas.width / 2,
                y: this.canvas.height / 2,
                vx: (Math.random() - 0.5) * 15,
                vy: (Math.random() - 0.5) * 15,
                life: 100,
                color: `hsl(${Math.random()*360}, 100%, 50%)`
            });
        }
        if(!this.isRunning) this.loop();
    },
    loop: function() {
        this.isRunning = true;
        this.ctx.clearRect(0,0,this.canvas.width, this.canvas.height);
        
        for(let i=0; i<this.particles.length; i++) {
            let p = this.particles[i];
            p.x += p.vx;
            p.y += p.vy;
            p.vy += 0.2; // Gravity
            p.life--;
            this.ctx.fillStyle = p.color;
            this.ctx.fillRect(p.x, p.y, 5, 5);
        }
        
        this.particles = this.particles.filter(p => p.life > 0);
        
        if(this.particles.length > 0) requestAnimationFrame(() => this.loop());
        else this.isRunning = false;
    }
};

// --- PERSISTENCE ---
const Persistence = {
    key: 'trivia_rush_v1',
    save: function(score, streak, mode) {
        let data = JSON.parse(localStorage.getItem(this.key) || '{}');
        
        if (!data.bestScore || score > data.bestScore) data.bestScore = score;
        if (!data.bestStreak || streak > data.bestStreak) data.bestStreak = streak;
        if (mode === 'daily') {
             if (!data.dailyScore || score > data.dailyScore) data.dailyScore = score;
        }
        
        localStorage.setItem(this.key, JSON.stringify(data));
    },
    load: function() {
        let data = JSON.parse(localStorage.getItem(this.key) || '{}');
        document.getElementById('best-score').innerText = data.bestScore || 0;
        document.getElementById('best-streak').innerText = data.bestStreak || 0;
        document.getElementById('daily-score-prev').innerText = data.dailyScore ? `Record: ${data.dailyScore}` : 'Jugar';
    }
};

// --- INITIALIZATION & EVENTS ---
window.onload = function() {
    UI.showScreen('menu-screen');
};

document.addEventListener('keydown', (e) => {
    if (!document.getElementById('game-screen').classList.contains('active')) return;
    if (e.key.toLowerCase() === 'p') {
        Game.togglePause();
    }
    if (e.key === 'Escape') {
        Game.exitToMenu();
    }
    if (e.key === 'Enter') {
        // Allow manual skip if impatient
        if (document.getElementById('explanation-panel').classList.contains('show')) {
             if (State.autoNextTimeout) clearTimeout(State.autoNextTimeout);
             Game.nextQuestion();
        }
    }
    if (!State.answered) {
        if (e.key.toLowerCase() === 'f') PowerUps.use('5050');
    }
});
